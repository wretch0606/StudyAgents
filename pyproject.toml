[project]
name = "studyagents"
version = "0.1.0"
description = "多 Agent 知识问答复习系统"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.10,<2.11",
    "pydantic-settings>=2.7,<2.8",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<8.4",
    "pytest-asyncio>=0.25,<0.26",
    "httpx>=0.28,<0.29",
    "ruff>=0.9,<0.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "node_modules",
    "dist",
    "apps/frontend",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "apps/api/tests", "apps/worker/tests"]
